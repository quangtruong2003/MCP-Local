[package]
name = "local-workspace-mcp-manager"
version = "0.1.0"
edition = "2021"

[lib]
name = "local_workspace_mcp_manager"
path = "src/lib.rs"

[[bin]]
name = "local-workspace-mcp-manager"
path = "src/main.rs"

[features]
# Tauri convention: `cargo build` uses the dev server; `tauri build`
# (or any release bundle) enables this to embed the frontend assets.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
dunce = "1"
lc_core = { path = "../crates/core", package = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = "0.8"
rmcp = { version = "3.1", features = [
    "server",
    "transport-streamable-http-server",
    "client",
    "transport-streamable-http-client-reqwest",
    "macros",
] }
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
time.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

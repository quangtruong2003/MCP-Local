[package]
name = "local-workspace-mcp-manager"
version = "0.1.1"
edition = "2021"

[lib]
name = "local_workspace_mcp_manager"
path = "src/lib.rs"

[[bin]]
name = "local-workspace-mcp-manager"
path = "src/main.rs"

[features]
# Tauri convention: `cargo build` uses the dev server; `tauri build`
# (or any release bundle) enables this to embed the frontend assets.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
dunce = "1"
lc_core = { path = "../crates/core", package = "core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = "0.8"
rmcp = { version = "3.1", features = [
    "server",
    "transport-streamable-http-server",
    "client",
    "transport-streamable-http-client-reqwest",
    "transport-child-process",
    "macros",
] }
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
time.workspace = true
thiserror.workspace = true
async-trait = "0.1"
url = "2"
rand = "0.10.2"
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile.workspace = true

# Fake funnel sidecar used by tests/connection_integration.rs. Lives beside the
# other test fixtures; `cargo test` builds it automatically into
# `<profile>/examples/fake_sidecar.exe`.
[[example]]
name = "fake_sidecar"
path = "tests/fixtures/fake_sidecar.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
xcap = { version = "0.9.8", default-features = false }

[package]
name = "core"
version = "0.1.0"
edition = "2021"

[lib]
# The crate is named `core`, which shadows `::core` inside rustdoc's doctest
# harness (breaking macro-generated paths like `::core::concat!` from the
# schemars derive). The crate has no doctests, so skip the harness entirely.
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars = "1"
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
dunce = "1"
globset = "0.4"
ignore = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

# Windows release gate for the Lightpanda WSL browser runtime.
#
# Builds the NSIS installer and enforces every release condition in order:
#   1. pinned Lightpanda/rootfs runtime manifest,
#   2. Rust unit + browser MCP integration tests,
#   3. the MANDATORY real-runtime browser integration suite (zero skips),
#   4. frontend + NSIS build,
#   5. the release verifier (licensing/source ref, no bundled browser engine,
#      NSIS < 100 MiB, zero-skip runtime log).
#
# The real-runtime suite runs with LW_REQUIRE_LIGHTPANDA_RUNTIME_TESTS=1, which
# turns any skipped runtime test into a hard failure. A release is therefore
# never marked green on skipped mandatory runtime tests: if WSL2/Lightpanda
# cannot be provisioned on the runner, the suite fails and the release is red.
# Use a Windows runner/VM with WSL2 enabled for this job.
name: windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Verify pinned Lightpanda runtime manifest
        run: npm run verify:lightpanda-runtime

      - name: Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Browser MCP integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test browser_mcp_integration

      - name: Enable WSL2 (best effort)
        shell: powershell
        run: |
          # A WSL2-capable runner is required for the mandatory real-runtime
          # tests below. If WSL2 cannot be enabled here, those tests fail closed
          # and the release is not marked green.
          wsl --status
          wsl --install --no-launch

      - name: Real-runtime browser integration tests (zero skips required)
        shell: bash
        run: |
          export LW_REQUIRE_LIGHTPANDA_RUNTIME_TESTS=1
          cargo test --manifest-path src-tauri/Cargo.toml --test browser_runtime_integration \
            --jobs 1 -- --nocapture 2>&1 \
            | tee src-tauri/target/browser-runtime-integration-release.log
          exit ${PIPESTATUS[0]}

      - name: Build frontend
        run: npm run build

      - name: Build NSIS installer
        run: npm run tauri build

      - name: Release gate (licensing, no bundled engine, size, zero-skip log)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-browser-release.ps1

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
